name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  blocksds:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM
        run: make rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: GameNWatchDS
          path: GameNWatchDS.nds


  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test renderer, audio and launcher without game ROMs
        run: python3 tools/run_regression_tests.py --sanitize
