; Game & Watch (.gnw) ROMs, played with GameNWatchDS from TWiLight Menu++.
;
; Installation (root of the SD card, "sd:" on a DSi/3DS and "fat:" on a DS
; flashcard):
;   * GameNWatchDS.nds -> /_nds/TWiLightMenu/emulators/
;   * this file        -> /_nds/TWiLightMenu/extras/
;   * the .gnw files   -> anywhere (for example /roms/gnw/)
;
; TWiLight Menu++ then lists every .gnw in the file browser and launches
; GameNWatchDS with the ROM as its argument, the same protocol PicoDriveTWL uses
; for .md/.gen ROMs (%PATH% is expanded to e.g.
; "sd:/roms/gnw/gnw_dkong.gnw"). Inside a game, R returns to TWiLight Menu++.
;
; Every key is documented in universal/include/common/customLaunchers.h of
; DS-Homebrew/TWiLightMenu; the values here are the defaults plus LAUNCHER_PATH,
; ARG and ICON. Only versions with custom launchers (config.<ext>.ini in extras)
; read this file, see the README of GameNWatchDS for the details.
[LAUNCHER]
HANDLER=direct
LAUNCHER_PATH=/_nds/TWiLightMenu/emulators/GameNWatchDS.nds
ARG=%PATH%
ICON=hb
RESOLVE=sd-first
BOOST_CPU=1
DS_MODE=0
NTR_SD_RELAUNCH=1
